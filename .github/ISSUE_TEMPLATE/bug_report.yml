name: Bug report
description: Something behaves incorrectly, crashes, or damages data.
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please run `npm run cli -- doctor` — it is read-only and its output
        answers most environment questions up front.

        **Found a security flaw?** Do not file it here. See
        [SECURITY.md](https://github.com/Rafaelrr5/Minecraft-Modpack-Assistant/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part?
      options:
        - CLI
        - Desktop app (alpha)
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `npm run cli -- version`, or the commit SHA you are on.
      placeholder: '0.1.0, or dda2f2f'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Windows 11 26100, macOS 15.2, Ubuntu 24.04'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`. The project requires 22.18 or newer.
      placeholder: 'v22.18.0'
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Loader and Minecraft version you targeted
      description: Leave blank if the bug is unrelated to a specific pack.
      placeholder: 'neoforge 21.1.72 / 1.21.1'

  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      description: The whole command line, unedited apart from removing any API key.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the error message or the wrong output.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: >
        Relevant terminal output, or the crash report the tool pointed you at. Please check for
        API keys before pasting.
      render: shell

  - type: dropdown
    id: instance_touched
    attributes:
      label: Was a Minecraft instance modified?
      description: >
        This matters a lot. The project's first promise is that your worlds and configs are
        safe, so an unexpected write is treated as a high-priority failure, not a normal bug.
      options:
        - 'No — it was a dry run or read-only command'
        - 'Yes, and that was expected (I passed --apply)'
        - 'Yes, and I did NOT expect it'
        - 'Not sure'
    validations:
      required: true
