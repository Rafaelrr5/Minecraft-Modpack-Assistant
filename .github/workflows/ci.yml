name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Desktop type-check
        run: npm run desktop:typecheck

      - name: Desktop build
        run: npm run desktop:build

      # Runtime proof of the preload bridge (spec 0022 FR-3 / AC-3): a green desktop build does not
      # prove the packaged GUI exposes `window.mpa`. The harness re-runs itself under `xvfb-run`
      # when no DISPLAY is present, so it works headlessly here and windowed on a developer machine.
      - name: Desktop preload smoke test
        run: node scripts/desktop-smoke.mjs
