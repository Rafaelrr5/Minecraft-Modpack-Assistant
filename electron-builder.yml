# electron-builder packaging for the desktop app (spec 0022, T-0022-12). Windows installer first
# (FR-8); macOS/Linux added when there is a user need. Run after `npm run desktop:build` (the
# `desktop:dist` script chains both). The electron entry is the built main bundle, set via
# extraMetadata so package.json "main" can stay the library entry (dist/index.js).
appId: com.modpackassistant.desktop
productName: Minecraft Modpack Assistant
directories:
  output: release
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
